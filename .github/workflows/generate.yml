name: Generate Podcast & Articles

on:
  schedule:
    # 6時間ごと（1日4回）。UTC基準。
    - cron: '0 */6 * * *'
  workflow_dispatch: {}   # 手動実行も可能

# 同時に複数実行されないようにする（state/コミット競合を防止）
concurrency:
  group: generate
  cancel-in-progress: false

permissions:
  contents: write   # 生成物をリポジトリへ commit & push するために必要

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          python run.py

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "差分なし: コミットをスキップします。"
          else
            git commit -m "chore: update episodes, feed and state [skip ci]"
            # ネットワーク等で失敗した場合に備えてリトライ
            for i in 1 2 3 4; do
              if git push; then
                echo "push 成功"
                break
              fi
              echo "push 失敗。$((2**i))秒後に再試行..."
              sleep $((2**i))
            done
          fi
