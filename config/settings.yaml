# =====================================================================
# システム全体の調整可能な設定。コードを触らずここを変えるだけで挙動を調整できます。
# =====================================================================

# 生成言語（既定: 日本語）
language: "ja"

# ---------------------------------------------------------------------
# GitHub Pages 公開設定。公開URLは下記から組み立てられます:
#   https://<github_user>.github.io/<repo_name>/
# ---------------------------------------------------------------------
site:
  github_user: "tatsu001"
  repo_name: "youtube-notify"
  title: "YouTube解説ポッドキャスト"
  description: "気になるYouTube動画を、2人のホストがカジュアルに解説するポッドキャストと読み物記事。"
  author: "youtube-notify"
  language: "ja"

# ---------------------------------------------------------------------
# ポッドキャストのホスト2人。
#   gemini_voice: Gemini TTS のプリセットボイス名
#   edge_voice:   edge-tts の日本語ニューラル音声名
# ---------------------------------------------------------------------
hosts:
  - name: "ナミ"
    role: "聞き手（素朴な疑問を投げかける）"
    gemini_voice: "Kore"
    edge_voice: "ja-JP-NanamiNeural"
  - name: "ケンタ"
    role: "話し手（やさしく噛み砕いて解説する）"
    gemini_voice: "Puck"
    edge_voice: "ja-JP-KeitaNeural"

# ---------------------------------------------------------------------
# 取得フィルタ
#   exclude_shorts: true のとき YouTube Shorts を生成対象から除外する
# ---------------------------------------------------------------------
filters:
  exclude_shorts: true

# ---------------------------------------------------------------------
# 生成の動作
#   max_per_run:   1回の実行で生成する最大本数（無料枠保護。超過分は次回実行で続行）
#   initial_count: 新規チャンネルの初回実行で生成する最新動画の本数
#                  （残りの既存動画はシード＝生成しない。以降は差分）
# ---------------------------------------------------------------------
generation:
  max_per_run: 3
  initial_count: 1

# ---------------------------------------------------------------------
# TTS（音声合成）設定
#   priority: 使用エンジンの優先順位。前から順に試し、失敗したら次へフォールバック。
#             利用可能: "gemini"（多話者・高品質, 無料枠に上限あり） / "edge"（完全無料・確実）
# ---------------------------------------------------------------------
tts:
  priority:
    - "gemini"
    - "edge"
  audio_bitrate: "64k"   # MP3ビットレート（リポジトリ肥大を防ぐため低めに）
  mono: true             # モノラル出力でファイルを軽量化

# ---------------------------------------------------------------------
# Gemini（テキスト生成 / TTS）設定
#   利用不可なモデルがあればここを差し替えるだけで切替できます。
# ---------------------------------------------------------------------
gemini:
  text_model: "gemini-2.5-flash"
  tts_model: "gemini-2.5-flash-preview-tts"
  media_resolution: "low"   # 動画解像度 low/medium/high（lowで無料枠トークンを節約）
  script_max_chars: 3500    # 対話台本の目安上限（長すぎるとTTS負荷が増える）
  article_min_chars: 3000   # 読み物記事の目安下限
  article_max_chars: 6000   # 読み物記事の目安上限

# ---------------------------------------------------------------------
# LINE通知（LINE Messaging API）設定
#   mode: "broadcast"（友だち全員=自分に送信。宛先不要で最小セットアップ） / "push"（userId指定）
#   push_to: mode が "push" のとき送信先のuserId
# ---------------------------------------------------------------------
line:
  mode: "broadcast"
  push_to: ""

# ---------------------------------------------------------------------
# 保持ポリシー
#   keep_audio_count: 残すMP3の最大本数（超過分は古い順に削除）
#   min_audio_keep:   最低でも必ず残す直近本数
#   記事HTML・一覧・フィードのメタ情報はすべて残します（軽量なため）。
# ---------------------------------------------------------------------
retention:
  keep_audio_count: 50
  min_audio_keep: 3

# ---------------------------------------------------------------------
# スケジュール（参考情報。実際の発火は .github/workflows/generate.yml の cron で制御）
#   既定: 6時間ごと（1日4回） cron: '0 */6 * * *'
# ---------------------------------------------------------------------
schedule_note: "6時間ごと（1日4回） / cron: '0 */6 * * *'"
